<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 380" width="100%" height="380">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="40%" stop-color="#111827" />
      <stop offset="100%" stop-color="#171026" />
    </linearGradient>

    <!-- Text Shimmer Gradient -->
    <linearGradient id="title-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="45%" stop-color="#818cf8" />
      <stop offset="75%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#f472b6" />
    </linearGradient>

    <linearGradient id="badge-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#311042" stop-opacity="0.8" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="soft-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <pattern id="grid-pattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.03)" stroke-width="1" />
      <circle cx="40" cy="40" r="1" fill="rgba(99, 102, 241, 0.2)" />
    </pattern>

    <style>
      @keyframes pulse {
        0%, 100% { transform: scale(1); opacity: 0.7; }
        50% { transform: scale(1.15); opacity: 1; }
      }
      @keyframes floatSlow {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-12px) rotate(1.5deg); }
      }
      @keyframes floatFast {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-8px); }
      }
      @keyframes scanline {
        0% { transform: translateY(-380px); }
        100% { transform: translateY(380px); }
      }
      @keyframes beaconRing {
        0% { r: 4px; opacity: 1; stroke-width: 2px; }
        100% { r: 24px; opacity: 0; stroke-width: 0.5px; }
      }
      @keyframes nodePulse {
        0%, 100% { fill: #38bdf8; r: 3.5px; }
        50% { fill: #f472b6; r: 5px; }
      }
      .mesh-dot { animation: nodePulse 3s ease-in-out infinite; }
      .beacon-ring-1 { animation: beaconRing 2.5s cubic-bezier(0.2, 0.8, 0.2, 1) infinite; }
      .beacon-ring-2 { animation: beaconRing 2.5s cubic-bezier(0.2, 0.8, 0.2, 1) 1.25s infinite; }
      .floating-orb { animation: floatSlow 8s ease-in-out infinite; }
      .floating-card { animation: floatFast 5s ease-in-out infinite; }
      .pill-badge { transition: all 0.3s ease; }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="100%" height="100%" fill="url(#bg-grad)" />
  <rect width="100%" height="100%" fill="url(#grid-pattern)" />

  <!-- Dynamic Ambient Glowing Orbs (Deep Background) -->
  <g class="floating-orb" opacity="0.65">
    <circle cx="180" cy="110" r="140" fill="#4f46e5" filter="url(#soft-glow)" opacity="0.25" />
    <circle cx="1100" cy="270" r="160" fill="#c026d3" filter="url(#soft-glow)" opacity="0.22" />
    <circle cx="640" cy="360" r="180" fill="#0284c7" filter="url(#soft-glow)" opacity="0.18" />
  </g>

  <!-- 2D Character Rigging & Motion Capture Facial Landmark Mesh Simulation (Background Decor) -->
  <g opacity="0.4" transform="translate(100, 30)">
    <!-- Rigging Bone / Lattice Lines -->
    <path d="M 940,90 L 980,140 L 960,200 L 1020,180 L 1060,110 L 1000,70 Z" fill="none" stroke="rgba(129, 140, 248, 0.3)" stroke-width="1.5" stroke-dasharray="4,4" />
    <path d="M 980,140 L 1000,165 L 1020,180 M 960,200 L 1000,240 L 1050,230 L 1020,180" fill="none" stroke="rgba(244, 114, 182, 0.35)" stroke-width="1.5" />
    <path d="M 90,160 L 140,110 L 210,130 L 180,210 L 120,240 Z" fill="none" stroke="rgba(56, 189, 248, 0.25)" stroke-width="1.5" stroke-dasharray="3,3" />

    <!-- Tracking Landmark Nodes (Left Cluster) -->
    <circle cx="140" cy="110" class="mesh-dot" style="animation-delay: 0.2s;" />
    <circle cx="210" cy="130" class="mesh-dot" style="animation-delay: 0.7s;" />
    <circle cx="180" cy="210" class="mesh-dot" style="animation-delay: 1.2s;" />
    <circle cx="120" cy="240" class="mesh-dot" style="animation-delay: 1.8s;" />
    <circle cx="90" cy="160" class="mesh-dot" style="animation-delay: 0.5s;" />

    <!-- Rig Nodes with Live Motion Capture Beacons (Right Cluster) -->
    <circle cx="980" cy="140" fill="#818cf8" class="mesh-dot" style="animation-delay: 0.4s;" />
    <circle cx="1020" cy="180" fill="#f472b6" class="mesh-dot" style="animation-delay: 0.9s;" />
    <circle cx="960" cy="200" fill="#38bdf8" class="mesh-dot" style="animation-delay: 1.5s;" />
    <circle cx="1000" cy="240" fill="#c084fc" class="mesh-dot" style="animation-delay: 2.1s;" />

    <!-- Beacon Pulse Ring around Active Mocap Focus Point -->
    <circle cx="980" cy="140" r="10" fill="none" stroke="#38bdf8" class="beacon-ring-1" />
    <circle cx="980" cy="140" r="10" fill="none" stroke="#c084fc" class="beacon-ring-2" />
  </g>

  <!-- Foreground Main Title and Hierarchy (Guaranteed in Front) -->
  <g id="foreground-content">
    <!-- Top Category Ribbon -->
    <g transform="translate(640, 72)">
      <rect x="-190" y="-16" width="380" height="32" rx="16" fill="rgba(255, 255, 255, 0.06)" stroke="rgba(129, 140, 248, 0.4)" stroke-width="1" />
      <circle cx="-160" cy="0" r="5" fill="#10b981" />
      <text x="-145" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#a5b4fc" letter-spacing="2">REAL-TIME 2D ANIMATION ECOSYSTEM</text>
    </g>

    <!-- Main Heading -->
    <text x="640" y="152" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="46" font-weight="900" fill="url(#title-grad)" filter="url(#glow)" letter-spacing="-0.5">
      Awesome Real-Time 2D Character Animation
    </text>

    <!-- Subtitle -->
    <text x="640" y="200" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#cbd5e1" letter-spacing="0.5">
      Curated Guide to Live Puppeteering, Webcam Mocap, 2D Mesh Rigging &amp; VTuber Runtimes
    </text>

    <!-- Capability Feature Badges / Pills -->
    <g transform="translate(640, 260)">
      <!-- Pill 1: Live Puppeteering -->
      <g transform="translate(-460, 0)">
        <rect x="0" y="0" width="210" height="42" rx="21" fill="url(#badge-grad)" stroke="rgba(56, 189, 248, 0.35)" stroke-width="1.2" />
        <text x="105" y="26" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#e0f2fe">🎭 Live Puppeteering</text>
      </g>

      <!-- Pill 2: Webcam Motion Capture -->
      <g transform="translate(-230, 0)">
        <rect x="0" y="0" width="210" height="42" rx="21" fill="url(#badge-grad)" stroke="rgba(129, 140, 248, 0.35)" stroke-width="1.2" />
        <text x="105" y="26" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#ede9fe">📹 Webcam Mocap</text>
      </g>

      <!-- Pill 3: 2D Mesh Deformation -->
      <g transform="translate(20, 0)">
        <rect x="0" y="0" width="210" height="42" rx="21" fill="url(#badge-grad)" stroke="rgba(192, 132, 252, 0.35)" stroke-width="1.2" />
        <text x="105" y="26" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#fae8ff">✨ 2D Mesh Rigging</text>
      </g>

      <!-- Pill 4: VTuber & Open Standards -->
      <g transform="translate(250, 0)">
        <rect x="0" y="0" width="210" height="42" rx="21" fill="url(#badge-grad)" stroke="rgba(244, 114, 182, 0.35)" stroke-width="1.2" />
        <text x="105" y="26" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#fce7f3">🚀 VTuber Standards</text>
      </g>
    </g>

    <!-- Bottom Indicator Line -->
    <line x1="240" y1="330" x2="1040" y2="330" stroke="url(#title-grad)" stroke-width="1" stroke-opacity="0.3" />
    <circle cx="640" cy="330" r="4" fill="#818cf8" />
  </g>
</svg>